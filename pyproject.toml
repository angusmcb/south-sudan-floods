[project]
name = "south_sudan_floods"
version = "0.1.0"
description = "Investigating floods in South Sudan and their humanitarian impact using Google Earth Engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.25",
    "geemap>=0.37.2",
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
]
